name: rcab-prod

# CI override: self-signed certs, inline env vars, no external dependencies.
# Usage: docker compose -f docker-compose.prod.yml -f docker-compose.prod-test.yml up -d

services:
  certbot:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    volumes:
      - certbot-etc:/etc/letsencrypt
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssl
        mkdir -p /etc/letsencrypt/live/rcab.example
        openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
          -keyout /etc/letsencrypt/live/rcab.example/privkey.pem \
          -out /etc/letsencrypt/live/rcab.example/fullchain.pem \
          -subj "/CN=rcab.example"
    restart: "no"

  nginx:
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      certbot:
        condition: service_completed_successfully

  # Local/CI builds of the same image names/tags the registry would hold, so
  # `pnpm prod:test` exercises the production Compose file unchanged (images are
  # built from source instead of pulled). RCAB_VERSION is set by scripts/prod-up.sh.
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile.prod
      args:
        RCAB_VERSION: ${RCAB_VERSION:?}
        RCAB_BUILT_AT: ${RCAB_BUILT_AT:-unknown}
    env_file: []
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://rcab:rcab@postgres:5432/rcab
      REDIS_URL: redis://:testpass@redis:6379
      OSRM_URL: http://osrm:5000
      # Throwaway CI-only values. NODE_ENV=production makes the api fail closed
      # without a >=32-byte JWT_SECRET, https CORS_ORIGINS and Firebase Admin
      # credentials (rem/api-auth). None of these is valid anywhere real.
      JWT_SECRET: ci-prod-test-0f8e6d4c2a1b3957e8d6c4a2f0b1d3e5
      CORS_ORIGINS: https://app.rcab.example
      FIREBASE_PROJECT_ID: rcab-ci
      # A syntactically valid (parseable PEM) service-account key is required at
      # boot. `pnpm prod:up` (scripts/prod-up.sh) generates a fresh throwaway one
      # per run so no key material is committed.
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile.prod
      # Throwaway public values so the CI image builds; the release pipeline
      # supplies the real ones as build args (Jenkinsfile).
      args:
        RCAB_VERSION: ${RCAB_VERSION:?}
        RCAB_BUILT_AT: ${RCAB_BUILT_AT:-unknown}
        NEXT_PUBLIC_API_URL: https://api.rcab.example
        # Google-only sign-in (RCAB-E8.S15): no Firebase values are needed while
        # phone OTP is off. Set WEB_AUTH_PHONE_ENABLED: "true" + the four
        # NEXT_PUBLIC_FIREBASE_* build args to build the phone-enabled variant.
        WEB_AUTH_PHONE_ENABLED: "false"
    environment:
      NODE_ENV: production
      PORT: "3000"

  migrator:
    # Reuses the api image built above (same tag); never pulled or rebuilt here.
    pull_policy: never
    env_file: []
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://rcab:rcab@postgres:5432/rcab

  postgres:
    env_file: []
    environment:
      POSTGRES_USER: rcab
      POSTGRES_PASSWORD: rcab
      POSTGRES_DB: rcab

  redis:
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "testpass"]
    environment:
      REDIS_PASSWORD: testpass

  backup:
    profiles: [disabled]

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

  uptime-kuma:
    ports:
      - "3003:3001"
