name: rcab-prod

# Release model (RCAB-E8.S11): api, web and the migrator run PRE-BUILT, immutable
# images tagged with the commit SHA of the release. Nothing is built on the VPS
# for them.
#   RCAB_VERSION   (required)  commit SHA to run; written by scripts/deploy/deploy.sh
#   RCAB_REGISTRY  (optional)  image registry/namespace, default ghcr.io/logicthread
# Local/CI prod-test builds the same tags from source via docker-compose.prod-test.yml.

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    networks: [rcab_net]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    image: ${RCAB_REGISTRY:-ghcr.io/logicthread}/rcab-api:${RCAB_VERSION:?RCAB_VERSION (commit SHA) must be set}
    networks: [rcab_net]
    env_file:
      - path: /opt/rcab/compose/env/api.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OSRM_URL: http://osrm:5000
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Readiness includes OSRM; a first graph build takes minutes, longer than
      # the healthcheck allows, so start the api once the graph exists.
      osrm-extract:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/v1/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    # NEXT_PUBLIC_* are inlined at image BUILD time (Dockerfile.prod build args,
    # supplied by the Jenkinsfile / prod-test); the running container reads none.
    image: ${RCAB_REGISTRY:-ghcr.io/logicthread}/rcab-web:${RCAB_VERSION:?RCAB_VERSION (commit SHA) must be set}
    networks: [rcab_net]
    environment:
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrator:
    # Same image as the api: one-shot `node dist/migrate.js` (compiled, no tsx).
    image: ${RCAB_REGISTRY:-ghcr.io/logicthread}/rcab-api:${RCAB_VERSION:?RCAB_VERSION (commit SHA) must be set}
    networks: [rcab_net]
    env_file:
      - path: /opt/rcab/compose/env/api.env
        required: false
    environment:
      NODE_ENV: production
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    build:
      context: ./postgres
    platform: linux/amd64
    networks: [rcab_net]
    env_file:
      - path: /opt/rcab/compose/env/postgres.env
        required: false
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: check TCP, not the Unix socket. On a fresh volume the
      # image's init runs a temporary socket-only server, which a socket check
      # reports healthy; the migrator then started early and failed with
      # ECONNREFUSED on the first deploy (found by `pnpm prod:test`).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    networks: [rcab_net]
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  # Routing graph, built once on a fresh osrm-data volume and reused afterwards
  # (the recovery runbook's "re-run the one-shot services"). Without these a
  # fresh host had no /data/region.osrm: osrm crash-looped and the api never
  # became ready (found by `pnpm prod:test`). Set OSM_PBF_URL in
  # /opt/rcab/compose/.env for another region; delete the volume to rebuild.
  osrm-prep:
    image: alpine:3.19
    networks: [rcab_net]
    environment:
      OSM_PBF_URL: ${OSM_PBF_URL:-https://download.geofabrik.de/asia/india/north-eastern-zone-latest.osm.pbf}
    volumes:
      - osrm-data:/data
    command: >
      sh -c '
        set -eu
        cd /data
        if [ -f region.osrm.mldgr ] || [ -f region.osm.pbf ]; then
          echo "[osrm-prep] PBF or graph already present"
        else
          apk add --no-cache curl
          echo "[osrm-prep] downloading $$OSM_PBF_URL"
          curl -fL --output region.osm.pbf.part "$$OSM_PBF_URL"
          mv region.osm.pbf.part region.osm.pbf
        fi
      '
    restart: "no"

  osrm-extract:
    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409
    platform: linux/amd64
    networks: [rcab_net]
    volumes:
      - osrm-data:/data
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        set -e;
        cd /data;
        if [ -f region.osrm.mldgr ]; then
          echo "[osrm-extract] graph already present";
        else
          osrm-extract -p /opt/car.lua region.osm.pbf &&
          osrm-partition region.osrm &&
          osrm-customize region.osrm &&
          echo "[osrm-extract] graph built";
        fi
    depends_on:
      osrm-prep:
        condition: service_completed_successfully
    restart: "no"

  osrm:
    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409
    platform: linux/amd64
    networks: [rcab_net]
    volumes:
      - osrm-data:/data:ro
    command: ["osrm-routed", "--algorithm", "mld", "--port", "5000", "/data/region.osrm"]
    depends_on:
      osrm-extract:
        condition: service_completed_successfully
    restart: unless-stopped

  # Nightly pg_dump -Fc -> age -> /opt/rcab/backups (+ optional env-configured
  # rclone offsite). /opt/rcab/secrets/age.key must hold the PUBLIC age recipient
  # only. Runbook: docs/operations/recovery-runbook.md (RCAB-E8.S3).
  backup:
    build:
      context: ./backup
    networks: [rcab_net]
    env_file:
      - path: /opt/rcab/compose/env/backup.env
        required: false
    environment:
      PGHOST: postgres
      PGPORT: "5432"
    volumes:
      - /opt/rcab/secrets/age.key:/run/secrets/age.key:ro
      - /opt/rcab/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    networks: [rcab_net]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v2.11.0@sha256:ddf9e5d226a56e886986838fa0ebedc0237511c78664352e8d0f4346ee022cd8
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    restart: "no"

  # --- Observability ---

  loki:
    image: grafana/loki:3.0.0
    networks: [rcab_net]
    volumes:
      - loki-data:/loki
      - ../observability/loki.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    networks: [rcab_net]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../observability/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on: [loki]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    networks: [rcab_net]
    volumes:
      - prom-data:/prometheus
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    networks: [rcab_net]
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    networks: [rcab_net]
    env_file:
      - path: /opt/rcab/compose/env/grafana.env
        required: false
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1
    networks: [rcab_net]
    volumes:
      - uptime-kuma-data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  rcab_net:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  osrm-data:
  jenkins-home:
  certbot-etc:
  certbot-webroot:
  loki-data:
  prom-data:
  grafana-data:
  uptime-kuma-data:
