# Local stand-in for "the VPS" (RCAB-E8.S11). Used ONLY by
# scripts/deploy/rehearse-local.sh, layered as:
#   -f docker-compose.prod.yml -f docker-compose.prod-test.yml -f docker-compose.release-sim.yml
# under its own compose project (rcab-sim) so it never touches a dev stack.
# It remaps host ports and replaces OSRM (which needs a routing dataset) with a stub
# that answers the one request the api readiness probe makes.

services:
  nginx:
    ports: !override
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"

  osrm:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    platform: !reset null
    volumes: !reset []
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf 'server { listen 5000; location / { default_type application/json; return 200 "{\\"code\\":\\"Ok\\"}"; } }\n' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
